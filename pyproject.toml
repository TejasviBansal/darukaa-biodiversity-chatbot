[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_configs = true
follow_imports = "skip"

[tool.pytest.ini_options]
markers = [
    "slow: requires ChromaDB and the real sentence-transformers embedding model",
]
